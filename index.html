<style>
  html, body { -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  input, select, textarea { font-size: 16px; }
  button, .btn, .ctrl { touch-action: manipulation; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1330; font-family: 'Baloo 2', system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .title-font { font-family: 'Luckiest Guy', cursive; letter-spacing: 1px; }
  .tstroke { -webkit-text-stroke: 2px #0b0e24; text-shadow: 0 4px 0 #0b0e24; }
  .tstroke-lg { -webkit-text-stroke: 3px #0b0e24; text-shadow: 0 7px 0 #0b0e24; }
  .tshadow { text-shadow: 0 2px 0 #0b0e24, 0 0 8px rgba(0,0,0,.4); }
  .panel { background: linear-gradient(180deg, #252a52, #1a1e40); border: 3px solid #0b0e24; border-radius: 22px; box-shadow: 0 8px 0 #0b0e24, 0 20px 40px rgba(0,0,0,.4); }
  .btn { font-family: 'Luckiest Guy', cursive; letter-spacing: .5px; border: 3px solid #0b0e24; border-radius: 16px; box-shadow: 0 5px 0 #0b0e24; transition: transform .08s, box-shadow .08s, filter .15s; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active, .pressed { transform: translateY(4px); box-shadow: 0 1px 0 #0b0e24 !important; }
  .btn:focus-visible, button:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; }
  .btn:disabled { filter: grayscale(.8) brightness(.75); cursor: not-allowed; }
  .btn-y { background: linear-gradient(#ffd23f, #ffb400); color: #3a2500; text-shadow: none; }
  .btn-g { background: linear-gradient(#5ef0a8, #2fbf71); }
  .btn-r { background: linear-gradient(#ff7a59, #e8452c); }
  .btn-b { background: linear-gradient(#5ac8fa, #2f80ed); }
  .btn-d { background: #3a3f72; }
  .pill { background: rgba(11,14,36,.78); border: 2px solid rgba(255,255,255,.18); border-radius: 999px; color: #fff; padding: 2px 10px; font-weight: 800; }
  kbd { background: #0b0e24; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 0 6px; font-family: inherit; }
  #overlay.dim { background: rgba(11,14,36,.55); }
  .ctrl { font-family: 'Luckiest Guy', cursive; color: #fff; border: 4px solid #0b0e24; box-shadow: 0 6px 0 #0b0e24; text-shadow: 0 2px 0 rgba(0,0,0,.4); touch-action: none; user-select: none; -webkit-user-select: none; line-height: 1.05; }
  .hudbar { height: 12px; border-radius: 999px; background: rgba(0,0,0,.45); overflow: hidden; flex: 1; border: 2px solid rgba(255,255,255,.15); }
  .hudbar > div { height: 100%; border-radius: 999px; transition: width .1s linear; }

</head>
<body>
<main class="fixed inset-0">
  <canvas id="game" class="absolute inset-0 block" aria-label="Zone de jeu Jhon.P-Racing"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden absolute inset-x-0 top-0 p-2 sm:p-3 flex items-start justify-between gap-2 pointer-events-none z-10">
    <div class="flex flex-col gap-1.5 w-36 sm:w-52">
      <div id="fuelPill" class="pill flex items-center gap-2 py-1">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" aria-hidden="true"><rect x="5" y="4" width="13" height="17" rx="2" fill="#e63946" stroke="#0b0e24" stroke-width="2"/><path d="M11.5 9c2 2.5 2 4.5 0 6-2-1.5-2-3.5 0-6z" fill="#fff"/></svg>
        <span class="sr-only">Essence</span><div class="hudbar"><div id="fuelBar" style="width:100%"></div></div>
      </div>
      <div class="pill flex items-center gap-2 py-1">
        <span class="text-xs text-[#7ae7ff] w-5 text-center font-extrabold" aria-hidden="true">N2O</span>
        <span class="sr-only">Nitro</span><div class="hudbar"><div id="nitroBar" style="width:100%"></div></div>
      </div>
    </div>
    <div class="flex flex-col items-center gap-1 min-w-0">
      <canvas id="speedo" class="w-28 h-16 sm:w-32 sm:h-[72px]" aria-hidden="true"></canvas>
      <div id="distLabel" class="pill title-font text-lg sm:text-xl">0 m</div>
      <div id="ghostWrap" class="hidden pill title-font text-base" style="color:#c9b8ff" aria-live="off"></div>
      <div id="rankWrap" class="hidden flex flex-col items-center gap-1">
        <div class="pill title-font text-[#ffd23f]">Position <span id="rankLabel">1er / 4</span></div>
        <div id="raceProg" class="relative w-36 sm:w-60 h-3 rounded-full bg-black/45 border-2 border-white/20"></div>
      </div>
    </div>
    <div class="flex flex-col items-end gap-1.5">
      <div class="flex gap-1.5 items-center">
        <div class="pill flex items-center gap-1"><svg viewBox="0 0 24 24" class="w-5 h-5" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc83d" stroke="#a86a12" stroke-width="2"/><ellipse cx="12" cy="13" rx="5.5" ry="4" fill="#ff9fb2" stroke="#c9566d" stroke-width="1.2"/></svg><span id="coinLabel">0</span><span class="sr-only">Porkcoins</span></div>
        <button id="btnPause" class="btn btn-d pointer-events-auto w-10 h-10 text-lg" aria-label="Pause">II</button>
      </div>
      <div class="pill flex items-center gap-1"><svg viewBox="0 0 24 24" class="w-5 h-5" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4cc9f0" stroke="#1d6fa3" stroke-width="1.6"/></svg><span id="gemLabel">0</span><span class="sr-only">Gemmes</span></div>
      <button id="btnMute" class="pill pointer-events-auto text-xs">Son : oui</button>
      <button id="btnGhost" class="hidden pill pointer-events-auto text-xs">Fantôme : oui</button>
    </div>
  </div>

  <div id="countdown" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none z-10 title-font text-8xl text-[#ffd23f] tstroke-lg" aria-live="assertive"></div>

  <!-- Commandes tactiles -->
  <div id="controls" class="hidden absolute inset-x-0 bottom-0 p-3 sm:p-4 flex justify-between items-end gap-2 z-10 pointer-events-none">
    <div class="flex items-end gap-2 sm:gap-3">
      <button id="btnBrake" class="ctrl pointer-events-auto rounded-3xl w-28 h-28 sm:w-32 sm:h-32 text-xl" style="background:linear-gradient(#ff7a59,#e8452c)">FREIN<br><span class="text-[11px]">MARCHE ARRIÈRE</span></button>
      <button id="btnNitro" class="ctrl pointer-events-auto rounded-full w-20 h-20 sm:w-24 sm:h-24 p-1.5" style="background:#0b0e24" aria-label="Boost Nitro">
        <span id="nitroRing" class="block w-full h-full rounded-full p-1.5"><span class="w-full h-full rounded-full flex items-center justify-center text-center text-[11px] sm:text-xs" style="background:linear-gradient(#5ac8fa,#2f80ed)"><span id="nitroLabel">BOOST / NITRO</span></span></span>
      </button>
    </div>
    <button id="btnFlip" class="hidden ctrl pointer-events-auto rounded-2xl px-4 py-3 text-base sm:text-lg animate-bounce" style="background:linear-gradient(#ffd23f,#ffb400);color:#3a2500;text-shadow:none">REMETTRE SUR<br>LES ROUES</button>
    <div class="flex items-end gap-2 sm:gap-3">
      <button id="btnAbility" class="hidden ctrl pointer-events-auto rounded-full w-20 h-20 sm:w-24 sm:h-24 text-[11px] sm:text-xs leading-tight" style="background:linear-gradient(#7ae7ff,#2f80ed)" aria-label="Plaquage au sol"><span id="abilityLabel">PLAQUER<br>AU SOL</span></button>
      <button id="btnGas" class="ctrl pointer-events-auto rounded-3xl w-28 h-28 sm:w-32 sm:h-32 text-3xl" style="background:linear-gradient(#5ef0a8,#2fbf71)">GAZ</button>
    </div>
  </div>

  <div id="overlay" class="absolute inset-0 z-20 overflow-y-auto"></div>
  <div id="toast" role="status" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-30 px-4 py-2 rounded-xl text-white font-extrabold border-2 border-[#0b0e24] opacity-0 translate-y-4 transition pointer-events-none"></div>
</main>

/* ===== Audio (Web Audio API synthétisé) ===== */
const SFX = {

/* ===== Monde & terrain procédural ===== */
function makeGround(map, seed) {
  const T = map.terrain;
  if (T.style === "city") {
    const seg = T.segment, lvl = i => (i <= 1 ? 0 : Math.round((hash1(i, seed) * 2 - 1) * T.levels) * T.step);
    return x => {
      const i = Math.floor(x / seg), local = x - i * seg;
      let h = lerp(lvl(i - 1), lvl(i), smooth(0, T.ramp, local));
      if (i > 1 && hash1(i, seed + 9) > 0.55) { const k0 = seg * 0.55, k1 = seg * 0.8; if (local > k0 && local < k1) h += ((local - k0) / (k1 - k0)) * T.kicker; }
      return -h;

  }
  return x => {
    let h = 0; for (const [amp, len] of T.amps) h += amp * vnoise(x / len, seed + len);
    const diff = 0.65 + Math.min(1, x / 40000) * 0.6;
    return -(h * diff * smooth(250, 1400, x) + Math.max(0, x - 600) * (T.trend || 0));
  };
}

/* ===== Physique du véhicule (corps rigide + suspensions à ressorts) ===== */
function stepPlayer(p, S, inp, dt) {

      const pvx = p.vx - p.w * ry, pvy = p.vy + p.w * rx, vn = pvx * nx + pvy * ny, vt = pvx * tx + pvy * ty;

function handleLanding(p, S, clean, airT, rot) {

  if (S.bouncy) { p.slipT = 0.45; p.w += (Math.random() - 0.5) * Math.min(7, airT * 6); }

  const boost = gadgetValue("landing");

    if (da < 0.25) { p.vx += Math.cos(p.a) * boost; p.vy += Math.sin(p.a) * boost; floatText(p.x, p.y - 130, "Atterrissage parfait !", "#3ddc97"); SFX.whoosh(); }
  }
}

function flipVehicle() {
  const p = G.p, W = G.world; if (!p) return;
  p.a = Math.atan(W.slope(p.x)); p.w = 0; p.vx = 0; p.vy = 0;
  p.y = W.ground(p.x) - (G.S.anchorY + G.S.suspLen + G.S.wheelR) - 30; p.stuckT = 0; p.airT = 0; p.rot = 0;
  for (let i = 0; i < 14; i++) spawn(p.x + (Math.random() - 0.5) * 80, p.y + 30, (Math.random() - 0.5) * 120, -Math.random() * 100, 0.8, 10, "rgba(255,255,255,0.7)", -20, "smoke");

  } else if (pk.kind === "gem") {
    c.fillStyle = "#4cc9f0"; c.lineWidth = 2.5; poly(c, [-11, -4, -6, -11, 6, -11, 11, -4, 0, 12]); c.fill(); c.strokeStyle = "#1d6fa3"; c.stroke();
    c.fillStyle = "rgba(255,255,255,0.7)"; poly(c, [-6, -9, -1, -9, -4, -4]); c.fill();
  } else {
    c.fillStyle = "#e63946"; c.lineWidth = 2.5; rr(c, -12, -15, 24, 30, 4); c.fill(); c.stroke();
    c.fillStyle = "#222"; rr(c, -4, -21, 10, 7, 2); c.fill();
    c.fillStyle = "#fff"; c.beginPath(); c.moveTo(0, -8); c.quadraticCurveTo(7, 2, 0, 8); c.quadraticCurveTo(-7, 2, 0, -8); c.fill();
  }
  c.restore();
}

function drawFinish(c, x, ground) {
  const y = ground(x);
  for (let i = 0; i < 2; i++) { const px = x + i * 60; c.fillStyle = "#ddd"; c.strokeStyle = OUT; c.lineWidth = 2; rr(c, px - 3, ground(px) - 150, 6, 150, 2); c.fill(); c.stroke(); }
  const by = Math.min(y, ground(x + 60)) - 150; c.fillStyle = "#fff"; rr(c, x - 6, by - 4, 72, 26, 4); c.fill(); c.stroke();
  for (let r = 0; r < 2; r++) for (let k = 0; k < 8; k++) if ((r + k) % 2 === 0) { c.fillStyle = OUT; c.fillRect(x - 4 + k * 8.5, by - 2 + r * 11, 8.5, 11); }
  c.fillStyle = "#ffd23f"; c.font = "bold 16px 'Luckiest Guy', sans-serif"; c.textAlign = "center"; c.fillText("ARRIVÉE", x + 30, by - 10); c.textAlign = "left";
}

function drawSign(c, x, y, text, color) {
  c.fillStyle = "#6b4a2e"; c.fillRect(x - 2, y - 46, 4, 46);
  c.fillStyle = color; c.strokeStyle = OUT; c.lineWidth = 2; rr(c, x - 26, y - 62, 52, 20, 4); c.fill(); c.stroke();
  c.fillStyle = "#fff"; c.font = "bold 12px 'Baloo 2', sans-serif"; c.textAlign = "center"; c.fillText(text, x, y - 47); c.textAlign = "left";
}

function drawSpeedo(cv, kmh, maxKmh) {
  const DPRp = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * DPRp) { cv.width = w * DPRp; cv.height = h * DPRp; }
  const c = cv.getContext("2d"); c.setTransform(DPRp, 0, 0, DPRp, 0, 0); c.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h - 8, r = Math.min(w / 2 - 6, h - 14), a0 = Math.PI, t = clamp(kmh / maxKmh, 0, 1);
  c.lineWidth = 8; c.lineCap = "round"; c.strokeStyle = "rgba(255,255,255,0.15)"; c.beginPath(); c.arc(cx, cy, r, a0, 0); c.stroke();
  const gr = c.createLinearGradient(cx - r, 0, cx + r, 0); gr.addColorStop(0, "#3ddc97"); gr.addColorStop(0.6, "#ffd23f"); gr.addColorStop(1, "#ff5d3a");
  c.strokeStyle = gr; c.beginPath(); c.arc(cx, cy, r, a0, a0 + Math.PI * t + 0.001); c.stroke();
  const na = a0 + Math.PI * t; c.strokeStyle = "#fff"; c.lineWidth = 3; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(na) * (r - 10), cy + Math.sin(na) * (r - 10)); c.stroke();
  c.fillStyle = "#fff"; circle(c, cx, cy, 4); c.fill();
  c.font = "18px 'Luckiest Guy', sans-serif"; c.textAlign = "center"; c.fillText(Math.round(kmh), cx, cy - 12);
  c.font = "bold 9px 'Baloo 2', sans-serif"; c.fillStyle = "rgba(255,255,255,0.7)"; c.fillText("KM/H", cx, cy + 2);
}

</script>
<script>
/* ===== Boucle de jeu, rendu de scène, HUD et contrôles ===== */
const $ = id => document.getElementById(id);
const canvas = $("game"), ctx = canvas.getContext("2d");
let CW = 0, CH = 0, DPR = 1;
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); CW = window.innerWidth; CH = window.innerHeight; canvas.width = CW * DPR; canvas.height = CH * DPR; canvas.style.width = CW + "px"; canvas.style.height = CH + "px"; }
window.addEventListener("resize", resize); resize();

/* ===== Anti-zoom iPad / iPhone (Safari ignore user-scalable=no) ===== */
(function () {
  const stop = e => e.preventDefault();
  // pincement (gestes propres à Safari iOS)
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, stop, { passive: false }));
  // pincement à plusieurs doigts (ex. plusieurs boutons pressés en même temps)
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 && (e.scale === undefined || e.scale !== 1)) e.preventDefault(); }, { passive: false });
  // double-clic / double-tap rapide
  document.addEventListener("dblclick", stop, { passive: false });
  // si malgré tout la page est zoomée : on remet le zoom à 1
  const meta = document.querySelector('meta[name="viewport"]'), base = meta ? meta.content : "";
  let fixing = false;
  function resetZoom() {
    const vv = window.visualViewport;
    if (!vv || fixing || !meta || vv.scale <= 1.01) return;
    fixing = true; meta.content = "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
    setTimeout(() => { meta.content = base; window.scrollTo(0, 0); fixing = false; resize(); }, 120);
  }
  if (window.visualViewport) { visualViewport.addEventListener("resize", resetZoom); visualViewport.addEventListener("scroll", resetZoom); }
  document.addEventListener("touchend", () => setTimeout(resetZoom, 50), { passive: true });
  window.addEventListener("orientationchange", () => setTimeout(() => { resetZoom(); resize(); }, 250));
})();

function getInput() {
  const frozen = G.countdown > 0 || (G.p && G.p.finished);
  if (frozen) return { gas: false, brake: false, nitro: false };
  return { gas: G.keys.gas || G.touch.gas, brake: G.keys.brake || G.touch.brake, nitro: !G.noAssist && (G.keys.nitro || G.touch.nitro) };
}

function update(dt) {
  const W = G.world, p = G.p, S = G.S, R = G.run, inp = getInput();
  W.time += dt;
  if (G.countdown > 0) {
    const before = Math.ceil(G.countdown); G.countdown -= dt; const after = Math.ceil(G.countdown);
    if (G.countdown <= 0) { G.goT = 0.8; SFX.go(); } else if (after !== before) SFX.count();
  } else if (W.mode === "race" && !p.finished) G.raceTime += dt;
  if (G.goT > 0) G.goT -= dt;

  // Nitro avec jauge de refroidissement
  const wasOn = p.nitroOn;
  if (p.freeNitro > 0) { p.freeNitro -= dt; p.nitroOn = true; }
  else if (inp.nitro && p.nitroLock <= 0 && p.nitro > 0) {
    p.nitroOn = true; p.nitro -= CONFIG.game.nitroDrainPerSec * dt;
    if (p.nitro <= 0) { p.nitro = 0; p.nitroLock = CONFIG.game.nitroOverheatSec; }
  } else {
    p.nitroOn = false;
    if (p.nitroLock > 0) p.nitroLock -= dt; else p.nitro = Math.min(S.nitroCap, p.nitro + S.nitroRecharge * dt);
  }
  SFX.nitro(p.nitroOn, S.type); MUS.hype = p.nitroOn;

  if (S.ability && p.abil) {
    if (p.abil.t > 0) { p.abil.t -= dt; if (p.abil.t <= 0) { p.abil.t = 0; p.abil.cd = S.ability.cooldown; } }
    else if (p.abil.cd > 0) p.abil.cd = Math.max(0, p.abil.cd - dt);
  }
  // Gadget Roue de Feu : se déclenche en accélérant, dure X s, puis recharge
  { const fw = gadgetValue("fireWheel"), f = p.fire;
    if (fw > 0 && f) {
      if (f.t > 0) { f.t -= dt; if (f.t <= 0) { f.t = 0; f.bonus = 0; f.cd = CONFIG.game.fireWheelCooldown; floatText(p.x, p.y - 80, "Roue de Feu terminée", "#ff9f1c"); } }
      else if (f.cd > 0) f.cd = Math.max(0, f.cd - dt);
      else if (inp.gas && p.fuel > 0 && G.countdown <= 0) { f.t = CONFIG.game.fireWheelDuration; f.bonus = fw; floatText(p.x, p.y - 100, "Roue de Feu ! +" + Math.round(fw * 100) + "%", "#ff7a1a"); SFX.whoosh(); }
    } else if (f) { f.t = 0; f.bonus = 0; }
  }
  const n = CONFIG.game.substeps, h = dt / n;
  for (let i = 0; i < n; i++) stepPlayer(p, S, inp, h);
  GHOST.tick(dt, W, p);

  // Carburant
  if (G.countdown <= 0 && !p.finished) {
    p.fuel -= ((CONFIG.game.idleFuelFactor + (inp.gas ? 1 : 0)) * S.fuelUse * dt) / (CONFIG.game.fuelBaseSeconds * S.tankMult);
  }
  if (p.fuel < 0) p.fuel = 0;
  if (p.fuel > 0 && p.fuel < CONFIG.game.lowFuelThreshold) { G.lowFuelT -= dt; if (G.lowFuelT <= 0) { SFX.beep(); G.lowFuelT = 0.9; } }

  // Distance & pièces de distance
  const dist = (p.x - R.startX) / PPM;
  if (dist > R.maxDist) {
    R.maxDist = dist;
    const tens = Math.floor(dist / 10);
    if (tens > R.distCoins) { earn((tens - R.distCoins) * CONFIG.game.coinsPer10m * (R.mode === "infinite" ? 1 + Math.min(6, tens / 100) : 1)); R.distCoins = tens; }
  }
  ensureGenerated(p.x);
  if (Math.floor(W.time) !== Math.floor(W.time - dt)) pruneWorld(p.x);

  // Zones mobiles (sable)
  for (const z of W.zones) if (z.move) { const off = Math.sin(W.time * 0.5 + z.phase) * z.move; z.x0 = z.b0 + off; z.x1 = z.b1 + off; }

  // Obstacles
  const cos = Math.cos(p.a), sin = Math.sin(p.a), shield = Math.max(gadgetValue("shield"), p.abil && p.abil.t > 0 ? 1 : 0);
  const pts = S.hull.map(([hx, hy]) => [p.x + hx * cos - hy * sin, p.y + hx * sin + hy * cos, 0]).concat(p.wheels.map(w => [w.cx, w.cy, w.r]));
  for (const o of W.obstacles) {
    if (o.broken) continue;
    const def = CONFIG.obstacles[o.type];
    if (def.rolling) {
      if (!o.active && o.x - p.x < 1100) o.active = true;
      if (o.active) { const sp = def.speed * (1 + clamp(W.slope(o.x), -0.5, 0.8)); o.x -= sp * dt; o.rot -= (sp * dt) / (o.w / 2); }
    }
    if (Math.abs(o.x - p.x) > 220) continue;
    const bottom = o.float ? W.ground(o.x) - o.float + Math.sin(W.time * 2 + o.phase) * 10 : W.ground(o.x) + 4;
    o.drawY = bottom;
    const l = o.x - o.w / 2, r = o.x + o.w / 2, t = bottom - o.h;
    const hit = pts.some(([px, py, pr]) => px + pr > l && px - pr < r && py + pr > t && py - pr < bottom);
    if (hit) smash(o, def, shield);
  }

  // Lianes (Savane) : le rideau ralentit
  let inVine = false;
  for (const v of W.vines) {
    if (Math.abs(v.x - p.x) > 900) continue;
    const hit = Math.abs(v.x - p.x) < v.w / 2 + 10 && p.y > W.ground(v.x) - v.h + 40;
    v.sway += ((hit ? 1 : 0) - v.sway) * Math.min(1, dt * 5);
    if (hit) {
      inVine = true;
      const k = Math.max(0, 1 - CONFIG.game.vineDrag * dt); p.vx *= k; p.vy *= 1 - CONFIG.game.vineDrag * 0.3 * dt;
      if (Math.random() < 0.5) spawn(p.x + (Math.random() - 0.5) * 40, p.y - 20 - Math.random() * 40, (Math.random() - 0.5) * 80, -Math.random() * 60, 0.6, 3, Math.random() < 0.5 ? "#3fa34d" : "#7acb5a", 200, "chunk");
    }
  }
  if (inVine && !p.inVine) floatText(p.x, p.y - 60, "Lianes !", "#7acb5a");
  p.inVine = inVine;

  // Bonus à ramasser
  const magnet = Math.max(gadgetValue("magnet"), S.magnet || 0);
  for (const pk of W.pickups) {
    if (pk.taken || Math.abs(pk.x - p.x) > 700) continue;
    const dx = p.x - pk.x, dy = p.y - 10 - pk.y, d = Math.hypot(dx, dy);
    if (magnet && pk.kind !== "gas" && d < magnet && d > 1) { const m = Math.min(d, 700 * dt); pk.x += (dx / d) * m; pk.y += (dy / d) * m; }
    let near = d < S.collectR;
    if (!near) for (const wh of p.wheels) if (Math.hypot(wh.cx - pk.x, wh.cy - pk.y) < wh.r + 24) { near = true; break; }
    if (near) collect(pk);
  }

  // Nuages de cendres
  let inAsh = false;
  for (const cl of W.clouds) { cl.x += cl.vx * dt; const cy = W.ground(cl.x) - cl.yOff; if (Math.hypot(p.x - cl.x, p.y - cy) < cl.r) inAsh = true; }
  G.ash = lerp(G.ash, inAsh ? 0.5 : 0, Math.min(1, dt * 3));

  // Bots
  updateBots(dt);

  // Véhicule coincé sur le toit
  const speed = Math.hypot(p.vx, p.vy), upside = Math.cos(p.a - Math.atan(W.slope(p.x))) < 0.1;
  if (upside && p.bodyContact && speed < 140) p.stuckT += dt; else p.stuckT = Math.max(0, p.stuckT - dt * 2);

  // Particules du véhicule
  if (inp.gas && p.fuel > 0 && Math.random() < 0.5) {
    const ex = p.x - (S.body.w / 2) * cos, ey = p.y - (S.body.w / 2) * sin;
    spawn(ex, ey, -cos * 40 + (Math.random() - 0.5) * 20, -30, 0.7, 5, "rgba(120,120,130,0.5)", -40, "smoke");
  }
  for (const w of p.wheels) {
    if (w.contact && Math.abs(w.vt) > 120 && Math.random() < 0.4) {
      const col = w.zone ? CONFIG.terrainEffects[w.zone].color : W.map.dirt;
      spawn(w.cx - w.r * 0.5, w.cy + w.r * 0.8, -Math.sign(w.vt) * (60 + Math.random() * 120), -80 - Math.random() * 140, 0.5, 2.5 + Math.random() * 2, col, 700);
    }
  }
  if (p.fire && p.fire.t > 0) for (const w of p.wheels) if (Math.random() < 0.6) spawn(w.cx - w.r * 0.4, w.cy + w.r * 0.6, -cos * 120 + (Math.random() - 0.5) * 60, -40 - Math.random() * 90, 0.35, 3 + Math.random() * 3, Math.random() < 0.5 ? "#ff7a1a" : "#ffe066", -80, "spark");
  if (p.nitroOn) spawn(p.x - (S.body.w / 2 + 20) * cos, p.y - (S.body.w / 2 + 20) * sin, -cos * 200, -sin * 200, 0.3, 4, Math.random() < 0.5 ? "#ffb020" : "#7ae7ff", 0);
  if (p.shieldPulse > 0) p.shieldPulse -= dt * 2;

  for (const pt of G.parts) {
    pt.life -= dt; pt.vy += pt.grav * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    if (pt.type === "smoke") pt.size += dt * 14;
  }
  G.parts = G.parts.filter(pt => pt.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 40 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);

  // Caméra
  const zoom = 1;
  {
    // La caméra accélère son suivi avec la vitesse, et reste bornée pour que la voiture ne sorte jamais de l'écran
    const sp = Math.hypot(p.vx, p.vy);
    const scl = clamp(Math.min(CW / 1000, CH / 560), 0.5, 1.3) * (1 - Math.min(0.18, sp / 6000));
    const follow = 4 + Math.min(14, Math.abs(p.vx) / 120);
    G.cam.x = lerp(G.cam.x, p.x + clamp(p.vx * 0.2, -120, 260), Math.min(1, dt * follow));
    const maxAhead = Math.max(40, (CW * 0.62 - 130) / scl), maxBehind = Math.max(40, (CW * 0.38 - 130) / scl);
    G.cam.x = clamp(G.cam.x, p.x - maxAhead, p.x + maxBehind);
  }
  G.cam.y = lerp(G.cam.y, p.y - 40, Math.min(1, dt * 4));

  // Son moteur
  const avgVt = p.wheels.reduce((s, w) => s + Math.abs(w.vt), 0) / p.wheels.length;
  SFX.setEngine(clamp(avgVt / S.topSpeed + (inp.gas && p.fuel > 0 ? 0.25 : 0) + (p.nitroOn ? 0.2 : 0), 0, 1.3), inp.gas && p.fuel > 0 ? 1 : 0);

  // Fin de course / panne
  if (W.mode === "race" && !p.finished && p.x >= W.finishX) {
    p.finished = true; p.finishTime = Math.max(0, G.raceTime - clamp((p.x - W.finishX) / Math.max(p.vx, 1), 0, dt)); G.finishT = 1.6; GHOST.markFinish(W, p);
    const place = 1 + G.bots.filter(b => b.finished).length;
    floatText(p.x, p.y - 90, place === 1 ? "VICTOIRE !" : place + "e place", "#ffd23f"); SFX.flip();
  }
  if (p.finished) { G.finishT -= dt; if (G.finishT <= 0) endRun("finish"); }
  if (p.fuel <= 0 && (speed < 25 || p.stuckT > 1.5)) p.outT += dt; else p.outT = 0;
  if (p.outT > 1.6 && !p.finished) endRun("fuel");
}

function smash(o, def, shield) {
  const p = G.p, S = G.S;
  o.broken = true; G.run.smashed++; questEvent("smash", 1);
  if (shield || S.crush) { if (shield) p.shieldPulse = 1; }
  else if (S.bouncy) { p.vx *= 1 - clamp(def.weight * 0.05, 0.01, 0.06); p.vy -= 260 * (0.6 + def.weight * 0.4); }
  else {
    const loss = clamp((def.weight / (S.mass * S.mass)) * 0.45, 0.03, 0.6);
    p.vx *= 1 - loss; p.vy -= (60 * def.weight) / S.mass; p.w += ((Math.random() - 0.5) * def.weight * 2) / S.mass;
  }
  const v = earn(CONFIG.game.smashReward * (shield || 1));
  floatText(o.x, (o.drawY || p.y) - o.h - 20, "Boum ! +" + v, "#ff9f1c");
  if (o.type === "crate") { const bc = gadgetValue("boostCharge"); if (bc) { chargeBoost(bc * 5); floatText(o.x, (o.drawY || p.y) - o.h - 50, "+" + Math.round(bc * 500) + "% Boost", "#7ae7ff"); } }
  for (let i = 0; i < 18; i++) spawn(o.x + (Math.random() - 0.5) * o.w, (o.drawY || p.y) - Math.random() * o.h, (Math.random() - 0.3) * 400 + p.vx * 0.4, -Math.random() * 380, 0.9, 3 + Math.random() * 4, def.colors[i % 2], 900, "chunk");
  G.shake = 6; SFX.smash();
}

function collect(pk) {
  const p = G.p; pk.taken = true;
  if (pk.kind === "coin") { const v = earn(CONFIG.game.coinValue); chargeBoost(gadgetValue("boostCharge")); questEvent("coins", v); SFX.coin(); for (let i = 0; i < 4; i++) spawn(pk.x, pk.y, (Math.random() - 0.5) * 120, -Math.random() * 120, 0.4, 2, "#ffd23f", 300, "spark"); }
  else if (pk.kind === "gem") { G.run.gems++; SFX.gem(); floatText(pk.x, pk.y - 20, "+1 Gemme", "#4cc9f0"); }
  else {
    p.fuel = 1; G.run.gas++; questEvent("gas", 1); SFX.fuel(); floatText(pk.x, pk.y - 30, "Plein d'essence !", "#3ddc97");
    const fn = gadgetValue("fuelNitro"); if (fn) { p.freeNitro = fn; floatText(pk.x, pk.y - 60, "Nitro-Essence !", "#7ae7ff"); }
  }
}

function updateBots(dt) {
  const W = G.world; if (W.mode !== "race" || G.countdown > 0) return;
  const p = G.p;
  for (const b of G.bots) {
    if (b.finished) { b.v *= 0.98; b.x += b.v * dt; continue; }
    const s = W.slope(b.x), pr = b.prof || { speed: 1, accel: 1, uphill: 1, grip: 1 }, sl = clamp(s, -0.7, 0.7);
    let target = CONFIG.game.botBaseSpeed * b.skill * diffDef().bot * (W.map.botSpeed || 1) * pr.speed * (1 + sl * 0.6 * (sl < 0 ? pr.uphill : 1));
    const z = zoneAt(b.x), eff = z && !((b.veh && b.veh.immune) || []).includes(z.type) ? CONFIG.terrainEffects[z.type] : null;
    if (eff) target *= Math.max(0.4, 1 - Math.max(0, 1 - eff.grip) * CONFIG.botVehicle.terrainEffect / pr.grip);
    const gap = b.x - p.x; if (gap > 1500) target *= 0.97; else if (gap < -1500) target *= 1.15;
    b.v += clamp(target - b.v, -400 * dt, 360 * pr.accel * dt);
    for (const v of W.vines) if (Math.abs(v.x - b.x) < v.w / 2) { b.v *= Math.max(0, 1 - CONFIG.game.vineDrag * dt); break; }
    b.x += b.v * dt; b.a = Math.atan(s); b.spin += (b.v / ((b.veh && b.veh.wheelR) || 15)) * dt;
    if (b.x >= W.finishX) { b.finished = true; b.finishTime = Math.max(0, G.raceTime - clamp((b.x - W.finishX) / Math.max(b.v, 1), 0, dt)); }
  }
}

function currentRank() {
  const p = G.p; let rank = 1;
  for (const b of G.bots) { if (p.finished) { if (b.finished && b.finishTime < p.finishTime) rank++; } else if (b.finished || b.x > p.x) rank++; }
  return rank;
}

/* ===== Rendu ===== */
function render() {
  const W = G.world; if (!W) return;
  const c = ctx, map = W.map;
  const playing = G.p && G.state !== "menu";
  const camX = playing ? G.cam.x : G.menuCamX, camY = playing ? G.cam.y : W.ground(G.menuCamX) - 60;
  let scale = clamp(Math.min(CW / 1000, CH / 560), 0.5, 1.3);
  if (playing) scale *= 1 - Math.min(0.18, Math.hypot(G.p.vx, G.p.vy) / 6000);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(c, map, camX, camY, CW, CH, scale);
  const sx = (Math.random() - 0.5) * G.shake, sy = (Math.random() - 0.5) * G.shake;
  const S2 = scale * DPR, ox = CW * 0.38 + sx, oy = CH * 0.55 + sy;
  c.setTransform(S2, 0, 0, S2, (ox - camX * scale) * DPR, (oy - camY * scale) * DPR);

const KEYMAP = { ArrowRight: "gas", KeyD: "gas", ArrowUp: "gas", KeyW: "gas", ArrowLeft: "brake", KeyA: "brake", ArrowDown: "brake", KeyS: "brake", Space: "nitro", ShiftLeft: "nitro", ShiftRight: "nitro" };

  if (ab.needsShield && !gadgetValue("shield")) { toast("Équipez le Bouclier d'Impulsion !"); return; }

}
$("btnAbility").addEventListener("pointerdown", e => { e.preventDefault(); SFX.init(); useAbility(); });
$("btnAbility").addEventListener("contextmenu", e => e.preventDefault());
$("btnPause").addEventListener("click", () => pauseGame());

function setPlayUI(on) { if (!on) { G.noAssist = false; const nb = $("btnNitro"); if (nb) nb.style.display = ""; } $("hud").classList.toggle("hidden", !on); $("controls").classList.toggle("hidden", !on); if (!on) $("countdown").classList.add("hidden"); }

function pauseGame() { if (G.state !== "play") return; G.state = "paused"; G.touch = { gas: false, brake: false, nitro: false }; SFX.setEngine(0, 0); SFX.nitro(false); MUS.hype = false; MUS.duck(true); showScreen("pause"); }
function resumeGame() { if (G.state !== "paused") return; hideScreen(); G.state = "play"; MUS.duck(false); }

function drawFX(dt) {
  if (!G.p || (G.state !== "play" && G.state !== "paused")) return;
  const c = ctx, t = G.weather, run = G.state === "play"; c.setTransform(DPR, 0, 0, DPR, 0, 0);

        else if (t === "snow") { q.y += 70 * dt * q.s; q.x += Math.sin(G.world.time * 1.5 + q.s * 9) * 30 * dt - 40 * dt; }

function loop(ts) {

    if (!c || (!c.loading && Date.now() - c.t > 60000)) loadBoard(key, mode, map, diff);
    const sel = (id, opts, cur) => `<select id="${id}" class="rounded-xl px-3 py-2 text-black font-extrabold w-full">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    const unit = v => mode === "race" ? Number(v).toFixed(3) + " s" : fmt(v) + " m";
    const me = e => cloudSess && e.user_id === cloudSess.uid;
    let list;
    if (!c || c.loading) list = `<p class="text-white/70 text-center py-6">Chargement du classement…</p>`;
    else if (c.err) list = `<p class="text-[#ff8a7a] text-center py-6">${escHtml(c.err)}</p>`;
    else if (!c.rows.length) list = `<p class="text-white/70 text-center py-6">Aucun score pour l'instant : sois le premier !</p>`;
    else list = c.rows.map((e, i) => `<div class="flex items-center gap-3 rounded-xl border-2 border-[#0b0e24] px-3 py-2 ${me(e) ? "bg-[#ffd23f] text-[#2a1c00]" : "bg-[#151938] text-white"}"><span class="title-font text-2xl w-10 ${me(e) ? "" : "text-[#ffd23f]"}">${i + 1}</span><span class="font-extrabold flex-1">${escHtml(e.pseudo)}</span><b>${unit(e.score)}</b></div>`).join("");
    const tb = (k, l) => `<button data-act="boardMode" data-arg="${k}" class="btn ${mode === k ? "btn-g" : "btn-d"} flex-1 py-2 text-lg">${l}</button>`;
    return wrap(`${header("Classement mondial")}<div class="max-w-xl mx-auto grid gap-3">
      <div class="flex gap-2">${tb("infinite", "Mode Infini")}${tb("race", "Course")}</div>
      <div class="grid ${mode === "race" ? "grid-cols-2" : "grid-cols-1"} gap-2">${sel("bMap", CONFIG.maps.map(m => [m.id, m.name]), map)}${mode === "race" ? sel("bDiff", DIFFS.map(d => [d.id, d.name]), diff) : ""}</div>
      <div class="grid gap-2">${list}</div>
      <div class="flex items-center justify-between gap-2"><button data-act="boardRefresh" class="btn btn-b py-2 px-4">Actualiser</button>${connected() ? `<span class="text-xs text-white/60">Ton pseudo apparaît en jaune</span>` : `<button data-act="nav" data-arg="account" class="btn btn-y py-2 px-4">Se connecter pour participer</button>`}</div></div>`);
  },
  account() {
    const inp = (id, ph, type = "text", extra = "") => `<input id="${id}" type="${type}" ${extra} autocomplete="off" placeholder="${ph}" class="w-full rounded-xl px-3 py-2 text-black font-extrabold" style="user-select:text;-webkit-user-select:text">`;
    const card = inner => `<div class="rounded-2xl bg-[#151938] border-4 border-[#0b0e24] p-4 text-white">${inner}</div>`;
    if (connected()) {
      return wrap(`${header("Mon compte")}<div class="grid gap-3 max-w-xl mx-auto">
        ${card(`<div class="flex items-center justify-between gap-2 flex-wrap"><div><div class="text-sm text-white/70 font-bold">Connecté en tant que</div><div class="title-font text-3xl text-[#ffd23f]">${escHtml(save.account.pseudo)}</div></div><span class="pill text-[#3ddc97]">En ligne</span></div>
          <p class="text-sm text-white/75 mt-2">${cloudStatusText()}</p>
          <p class="text-sm text-white/75 mt-1">Pour retrouver ta progression sur un autre appareil, connecte-toi avec ton pseudo et ton identifiant.</p>
          <button data-act="accSync" class="btn btn-b py-2 mt-3 w-full">Synchroniser maintenant</button>`)}
        <button data-act="nav" data-arg="board" class="btn btn-g py-3 text-lg">Voir le classement mondial</button>
        <button data-act="accLogout" class="btn btn-r py-3 text-lg">Se déconnecter</button></div>`);
    }
    const tab = G.accTab || "create", tb = (k, l) => `<button data-act="acctab" data-arg="${k}" class="btn ${tab === k ? "btn-y" : "btn-d"} py-2 text-base">${l}</button>`;
    const body = tab === "create"
      ? `<p class="text-sm text-white/80">Crée un compte : ta progression actuelle est conservée et sauvegardée en ligne, et tes scores entrent au classement mondial.</p>${inp("accP", "Pseudo (3 à 14 caractères)", "text", 'maxlength="14"')}${inp("accI", "Identifiant secret (6 caractères min.)", "password")}${inp("accI2", "Répéter l'identifiant", "password")}<button data-act="accCreate" class="btn btn-g py-3 text-xl">Créer le compte</button>`
      : `<p class="text-sm text-white/80">Retrouve ton compte depuis n'importe quel appareil.</p>${inp("accP", "Pseudo", "text", 'maxlength="14"')}${inp("accI", "Identifiant", "password")}<button data-act="accLogin" class="btn btn-g py-3 text-xl">Se connecter</button>`;
    return wrap(`${header("Compte")}<div class="grid gap-3 max-w-xl mx-auto"><div class="grid grid-cols-2 gap-2">${tb("create", "Créer un compte")}${tb("login", "Se connecter")}</div>${card(`<div class="grid gap-2">${body}</div>`)}</div>`);
  },
  settings() {
    return wrap(`${header("Paramètres")}
      <div class="grid gap-3 text-white">
        <button data-act="sound" class="btn ${save.sound ? "btn-g" : "btn-d"} py-3 text-xl">Son : ${save.sound ? "activé" : "coupé"}</button>
        <button data-act="music" class="btn ${save.music ? "btn-g" : "btn-d"} py-3 text-xl">Musique : ${save.music ? "activée" : "coupée"}</button>
        <label class="rounded-2xl bg-[#151938] border-4 border-[#0b0e24] p-3 flex items-center gap-3 font-bold text-white">Volume musique <input id="musicVol" type="range" min="0" max="100" value="${Math.round(save.musicVol * 100)}" class="flex-1"></label>
        <div class="rounded-2xl bg-[#151938] border-4 border-[#0b0e24] p-4">
          <h3 class="title-font text-xl mb-2">Commandes</h3>
          <ul class="text-sm grid gap-1 font-bold text-white/85">
            <li><kbd>→</kbd> / <kbd>D</kbd> / <kbd>W</kbd> : GAZ (en l'air : bascule en arrière)</li>
            <li><kbd>←</kbd> / <kbd>A</kbd> / <kbd>S</kbd> : FREIN / MARCHE ARRIÈRE (en l'air : bascule en avant)</li>
            <li><kbd>Espace</kbd> : BOOST / NITRO</li>
            <li><kbd>R</kbd> : REMETTRE SUR LES ROUES (si bloqué)</li>
            <li><kbd>Échap</kbd> / <kbd>P</kbd> : Pause</li>
          </ul>
          <p class="text-sm mt-2 text-white/70">Sur mobile, utilisez les gros boutons tactiles à l'écran.</p>
        </div>
        <div class="rounded-2xl bg-[#151938] border-4 border-[#0b0e24] p-4">
          <h3 class="title-font text-xl mb-2">Nom du joueur</h3>
          <input id="playerName" maxlength="14" value="${(save.playerName || "").replace(/"/g, "")}" placeholder="Joueur" class="w-full rounded-xl px-3 py-2 text-black font-extrabold" style="user-select:text;-webkit-user-select:text">
        </div>
        <button data-act="reset" class="btn btn-r py-3 text-lg">Réinitialiser la sauvegarde</button>
        <p class="text-xs text-white/60">Progression sauvegardée automatiquement sur cet appareil (et en ligne si tu es connecté).</p>
      </div>`);
  },
  pause() {
    return `<div class="min-h-full flex items-center justify-center p-4"><div class="panel p-6 w-full max-w-sm flex flex-col gap-3 text-center">
      <h2 class="title-font text-4xl text-[#ffd23f] tstroke">Pause</h2>
      <button data-act="resume" class="btn btn-g py-3 text-2xl">Reprendre</button>
      <button data-act="restart" class="btn btn-y py-3 text-xl">Recommencer</button>
      <button data-act="quit" class="btn btn-r py-3 text-xl">Abandonner</button></div></div>`;
  },
  results() {
    const r = lastResult; if (!r) return "";
    const rows = [["Distance", fmt(r.dist) + " m"], ["Saltos arrière / avant", r.back + " / " + r.front], ["Obstacles détruits", r.smashed], ["Bidons ramassés", r.gas], ["Porkcoins de la piste", "+" + fmt(r.runCoins)]];
    if (r.raceCoins) rows.push(["Prime de course", "+" + fmt(r.raceCoins)]);
    if (r.time) rows.push(["Temps", r.time.toFixed(3) + " s"]);
    return `<div class="min-h-full flex items-center justify-center p-4"><div class="panel p-5 sm:p-6 w-full max-w-lg text-white">
      <h2 class="title-font text-4xl sm:text-5xl text-center ${r.place === 1 ? "text-[#ffd23f]" : "text-white"} tstroke">${r.title}</h2>
      <p class="text-center font-bold text-white/80 mb-3">${r.subtitle}</p>
      ${r.board ? `<ol class="grid gap-1.5 mb-4">${r.board.map((b, i) => `<li class="flex items-center gap-3 rounded-xl px-3 py-2 ${b.me ? "bg-[#ffd23f] text-[#2a1c00]" : "bg-black/30"}"><span class="title-font text-xl w-8">${i + 1}${i ? "e" : "er"}</span><span class="w-3 h-3 rounded-full border-2 border-[#0b0e24]" style="background:${b.color}"></span><span class="font-extrabold flex-1">${b.name}</span><span class="font-bold">${b.dnf ? "Abandon" : b.time.toFixed(3) + " s"}</span></li>`).join("")}</ol>` : ""}
      <div class="grid gap-1 mb-3">${rows.map(([k, v]) => `<div class="flex justify-between bg-black/25 rounded-lg px-3 py-1.5 font-bold"><span class="text-white/75">${k}</span><span>${v}</span></div>`).join("")}</div>
      <div class="flex justify-center gap-3 mb-4"><span class="pill flex items-center gap-1 text-lg">${ICON.coin}+${fmt(r.totalCoins)}</span><span class="pill flex items-center gap-1 text-lg">${ICON.gem}+${r.totalGems}</span></div>
      <div class="grid grid-cols-2 gap-3"><button data-act="restart" class="btn btn-g py-3 text-xl">Rejouer</button><button data-act="toMenu" class="btn btn-y py-3 text-xl">Menu</button></div>
    </div></div>`;
  }
};

function showScreen(name) {
  currentScreen = name; overlay.innerHTML = SCREENS[name](); overlay.classList.remove("hidden");
  overlay.classList.toggle("dim", name !== "menu");
  requestAnimationFrame(() => {
    overlay.querySelectorAll("canvas[data-veh]").forEach(cv => drawPreview(cv, cv.dataset.veh, save.selChar, save.selSkin));
    overlay.querySelectorAll("canvas[data-char]").forEach(cv => drawCharPreview(cv, cv.dataset.char));
  });
}
function hideScreen() { overlay.classList.add("hidden"); overlay.innerHTML = ""; }
function rerender() { const st = overlay.scrollTop; showScreen(currentScreen); overlay.scrollTop = st; }
function spend(kind, amount) {
  if (save[kind] < amount) { toast(kind === "coins" ? "Pas assez de Porkcoins !" : "Pas assez de Gemmes !"); return false; }
  save[kind] -= amount; persist(); SFX.coin(); return true;
}
function goMenu() { MUS.play("menu"); G.state = "menu"; G.p = null; setPlayUI(false); createWorld(save.selMap, "menu"); G.menuCamX = 0; showScreen("menu"); }

function beginRun() { hideScreen(); startRun(); setupHUD(); setPlayUI(true); }

function endRun(reason) {
  if (G.state !== "play" && G.state !== "paused") return;
  G.state = "results"; SFX.stopEngine(); SFX.nitro(false); MUS.duck(false); G.touch = { gas: false, brake: false, nitro: false };
  const R = G.run, p = G.p, map = mapById(R.mapId), dist = Math.floor(Math.max(0, R.maxDist));
  let raceCoins = 0, raceGems = 0, place = null, board = null, title, subtitle, time = 0;
  if (R.mode === "race") {
    const me = { name: "Vous (" + charById(save.selChar).name + ")", color: "#ffd23f", me: true, dnf: !p.finished, time: p.finished ? p.finishTime : Infinity };
    const bots = G.bots.map(b => ({ name: b.name + (b.veh ? " (" + b.veh.name + ")" : ""), color: b.color, dnf: false, time: b.finished ? b.finishTime : G.raceTime + (G.world.finishX - b.x) / Math.max(b.v, 200) }));
    board = [me, ...bots].sort((a, b) => a.time - b.time); place = board.indexOf(me) + 1;
    if (p.finished) {
      raceCoins = Math.round(CONFIG.game.raceRewards.coins[place - 1] * G.S.coinMult); raceGems = Math.round(CONFIG.game.raceRewards.gems[place - 1] * diffDef().gem); time = p.finishTime;
      if (place === 1) questEvent("win", 1, { map: R.mapId });
      { const bk = R.mapId + (save.diff === "normal" || !save.diff ? "" : ":" + save.diff); if (!save.raceBest[bk] || time < save.raceBest[bk]) save.raceBest[bk] = time; GHOST.commit("race", R.mapId, save.diff || "normal", time); }
      title = place === 1 ? "VICTOIRE !" : place + "e place"; subtitle = map.name + " · Mode Course" + (raceGems ? " · Top 3 : +" + raceGems + " gemmes" : "");
    } else { title = reason === "fuel" ? "Panne sèche !" : "Course abandonnée"; subtitle = "Vous n'avez pas franchi la ligne d'arrivée."; }
  } else {
    const prev = save.records[R.mapId] || 0, rec = dist > prev;
    if (rec) save.records[R.mapId] = dist; GHOST.commit("inf", R.mapId, "-", dist);
    questEvent("infDist", dist);
    title = reason === "fuel" ? "Panne sèche !" : "Partie terminée"; subtitle = rec ? "Nouveau record sur " + map.name + " : " + fmt(dist) + " m !" : "Record sur " + map.name + " : " + fmt(prev) + " m";
  }
  try {
    const isRace = R.mode === "race", v = isRace ? (p.finished ? Math.round(time * 1000) / 1000 : 0) : dist;
    if (v > 0) postScore(isRace ? "race" : "infinite", R.mapId, isRace ? (save.diff || "normal") : "-", v).then(announceRank).catch(() => {});
  } catch (e) {}
  try {
    const st = save.stats = save.stats || {}, add = (k, v) => st[k] = (st[k] || 0) + v;
    add("flips", R.back + R.front); add("coins", R.coins); add("smashed", R.smashed); add("gas", R.gas); add("runs", 1);
    st.dist = Math.max(st.dist || 0, dist); st.flipsRun = Math.max(st.flipsRun || 0, R.back + R.front);
    if (R.mode === "race" && p.finished && place === 1) { st.winVeh = st.winVeh || {}; st.winVeh[G.S.id] = true; } if (R.mode === "race" && p.finished && place === 1) { add("wins", 1); save.beaten = save.beaten || {}; const dk = save.diff || "normal"; if (!save.beaten[dk]) { save.beaten[dk] = true; const ni = DIFFS.findIndex(d => d.id === dk) + 1; if (ni > 0 && ni < DIFFS.length) toast("Difficulté débloquée : " + DIFFS[ni].name + " !", "#ffd23f"); } }
  } catch (e) {}
  const totalCoins = R.coins + raceCoins, totalGems = R.gems + raceGems;
  save.coins += totalCoins; save.gems += totalGems; persist();
  lastResult = { title, subtitle, place, board, dist, back: R.back, front: R.front, smashed: R.smashed, gas: R.gas, runCoins: R.coins, raceCoins, totalCoins, totalGems, time };
  setPlayUI(false); showScreen("results"); try { checkAch(); } catch (e) {}
  MUS.jingle(R.mode === "race" ? (p.finished && place <= 3) : dist >= 500);
}

overlay.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  SFX.init(); SFX.click();
  const act = el.dataset.act, arg = el.dataset.arg;
  switch (act) {
    case "nav": if (arg === "garage") G.garageSel = save.selVehicle; showScreen(arg); break;
    case "diff": { const i = DIFFS.findIndex(d => d.id === arg); if (i >= 0) { if (diffUnlocked(i)) { save.diff = arg; persist(); rerender(); } else toast("Termine 1er en " + DIFFS[i - 1].name + " pour débloquer", "#ff7a59"); } break; }
    case "ghost": GHOST.toggle(); rerender(); break;
    case "mode": save.mode = arg; persist(); rerender(); break;
    case "map": {
      const m = mapById(arg);
      if (!save.maps[arg]) { if (!spend("coins", m.price)) return; save.maps[arg] = true; toast(m.name + " débloquée !", "#2fbf71"); }
      save.selMap = arg; persist(); createWorld(arg, "menu"); rerender(); break;
    }
    case "start": beginRun(); break;
    case "gsel": G.garageSel = arg; rerender(); break;
    case "buyVeh": { const v = vehicleById(arg); confirmBuy("Acheter " + v.name + " pour " + fmt(v.price) + " Porkcoins ?", () => { if (spend("coins", v.price)) { save.vehicles[arg].owned = true; save.selVehicle = arg; persist(); toast(v.name + " acheté !", "#2fbf71"); rerender(); } }); break; }
    case "selVeh": save.selVehicle = arg; persist(); rerender(); break;
    case "upg": { const vid = G.garageSel, cost = upgradeCost(vid, arg); if (save.vehicles[vid].up[arg] < CONFIG.upgrades.maxLevel && spend("coins", cost)) { save.vehicles[vid].up[arg]++; persist(); rerender(); } break; }
    case "skin": { const s = skinById(arg); if (!save.skins[arg]) { confirmBuy("Acheter le skin " + s.name + " pour " + s.price + " gemmes ?", () => { if (!spend("gems", s.price)) return; save.skins[arg] = true; save.selSkin = arg; persist(); toast("Skin " + s.name + " débloqué !", "#2f80ed"); rerender(); }); break; } save.selSkin = arg; persist(); rerender(); break; }
    case "selChar": save.selChar = arg; persist(); rerender(); break;
    case "buyChar": { const ch = charById(arg); confirmBuy("Débloquer " + ch.name + " pour " + ch.price + " gemmes ?", () => { if (spend("gems", ch.price)) { save.chars[arg] = true; save.selChar = arg; persist(); toast(ch.name + " rejoint l'équipe !", "#2f80ed"); rerender(); } }); break; }
    case "gadBuy": { const g = gadgetById(arg); if (spend("coins", g.price)) { save.gadgets[arg] = 1; if (save.equipped.length < CONFIG.game.maxGadgetsEquipped) save.equipped.push(arg); persist(); rerender(); } break; }
    case "gadUp": { const g = gadgetById(arg), lvl = save.gadgets[arg]; if (lvl < g.maxLevel && spend("coins", g.upgradeCost * lvl)) { save.gadgets[arg]++; persist(); rerender(); } break; }
    case "gadEq": {
      const i = save.equipped.indexOf(arg);
      if (i >= 0) save.equipped.splice(i, 1);
      else if (save.equipped.length >= CONFIG.game.maxGadgetsEquipped) { toast("Maximum " + CONFIG.game.maxGadgetsEquipped + " gadgets équipés"); return; }
      else save.equipped.push(arg);
      persist(); rerender(); break;
    }
    case "claim": { const q = save.daily.quests[+arg]; if (q && q.progress >= q.n && !q.claimed) { q.claimed = true; save.gems += q.reward; persist(); SFX.gem(); toast("+" + q.reward + " gemmes !", "#2f80ed"); rerender(); } break; }
    case "sound": save.sound = !save.sound; SFX.setOn(save.sound); persist(); updateMuteIcon(); rerender(); break;
    case "conv": { const n = +arg; if (spend("gems", n)) { save.coins += n * GEM_RATE; persist(); SFX.coin(); toast("+" + fmt(n * GEM_RATE) + " Porkcoins", "#2fbf71"); rerender(); } break; }
    case "buyx2": if (spend("gems", CONFIG.game.x2Cost)) { save.x2 = (save.x2 || 0) + 3; persist(); toast("Pièces x2 pour 3 parties !", "#2fbf71"); rerender(); } break;
    case "boardMode": G.bMode = arg; rerender(); break;
    case "boardRefresh": G.bCache = {}; rerender(); break;
    case "acctab": G.accTab = arg; rerender(); break;
    case "accCreate": accCreate(); break;
    case "accLogin": accLogin(); break;
    case "accSync": accSyncNow(); break;
    case "accLogout": accLogout(); break;
    case "reset": if (confirm("Effacer toute la progression ?")) { save = defaultSave(); persist(); SFX.setOn(save.sound); goMenu(); } break;
    case "music": save.music = !save.music; persist(); SFX.applyMusic(); rerender(); break;
    case "resume": resumeGame(); break;
    case "restart": SFX.stopEngine(); SFX.nitro(false); MUS.duck(false); beginRun(); break;
    case "quit": endRun("quit"); break;
    case "toMenu": goMenu(); break;
  }
});

/* ===== Lancement ===== */
SFX.on = save.sound; updateMuteIcon(); ensureDaily();
if (!save.maps[save.selMap]) save.selMap = "prairie";
if (!save.vehicles[save.selVehicle] || !save.vehicles[save.selVehicle].owned) save.selVehicle = "car";
if (!save.chars[save.selChar]) save.selChar = "adelin";
goMenu();
document.fonts && document.fonts.ready.then(() => { if (currentScreen === "menu" && G.state === "menu") showScreen("menu"); });
requestAnimationFrame(loop);

function confirmBuy(msg, yes) {
  const o = document.createElement("div");
  o.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(5,8,25,.75);display:flex;align-items:center;justify-content:center;padding:16px";
  o.innerHTML = '<div class="panel p-5 text-white text-center" style="max-width:380px;width:100%"><div class="title-font text-2xl mb-2">Confirmer l\'achat</div><p class="mb-4 font-bold">' + msg + '</p><div class="grid grid-cols-2 gap-3"><button id="cbNo" class="btn btn-d py-2 text-lg">Annuler</button><button id="cbYes" class="btn btn-g py-2 text-lg">Acheter</button></div></div>';
  document.body.appendChild(o);
  const close = () => o.remove();
  o.querySelector("#cbNo").onclick = close; o.onclick = e => { if (e.target === o) close(); };
  o.querySelector("#cbYes").onclick = () => { close(); yes(); };
}
document.addEventListener("change", e => {
  const id = e.target && e.target.id;
  if (id === "bMap") { G.bMap = e.target.value; rerender(); }
  else if (id === "bDiff") { G.bDiff = e.target.value; rerender(); }
});
document.addEventListener("input", e => { if (e.target && e.target.id === "musicVol") { save.musicVol = e.target.value / 100; persist(); SFX.applyMusic(); } if (e.target && e.target.id === "playerName") { save.playerName = e.target.value.slice(0, 14); persist(); } });

</script>
</body>
